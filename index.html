<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Hayat Defteri</title>

<style>
body{
background:#dfffd6;
font-family:Arial,sans-serif;
max-width:900px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
color:#2e7d32;
}

.kutu{
background:white;
padding:15px;
margin-top:15px;
border-radius:10px;
}

input,textarea,select{
width:100%;
padding:10px;
margin-top:10px;
box-sizing:border-box;
}

button{
padding:10px 15px;
margin-top:10px;
cursor:pointer;
}

.hidden{
display:none;
}
</style>
</head>
<body>

<h1>🌿 Hayat Defteri</h1>

<div id="loginBox" class="kutu">
<h3>Şifre Belirle / Giriş Yap</h3>

<input type="password" id="sifre">

<button onclick="giris()">Giriş</button>

<p id="hata"></p>
</div>

<div id="app" class="hidden">

<div class="kutu">
<h2>📅 Tarih</h2>
<input type="date" id="tarih">
</div>

<div class="kutu">
<h2>📝 Günlük</h2>

<textarea id="gunluk" rows="6"></textarea>

<select id="ruh">
<option>😄 Çok iyi</option>
<option>🙂 İyi</option>
<option>😐 Normal</option>
<option>😔 Kötü</option>
</select>

<button onclick="kaydet()">Kaydet</button>
</div>

<div class="kutu">
<h2>🎯 Hedefler</h2>

<input id="hedefInput">

<button onclick="hedefEkle()">Hedef Ekle</button>

<ul id="hedefListe"></ul>
</div>

<div class="kutu">
<h2>🔎 Arama</h2>

<input id="aramaInput" oninput="arama()" placeholder="Ara">

<ul id="aramaListe"></ul>
</div>

<div class="kutu">
<h2>📊 İstatistik</h2>

<p>Toplam Günlük: <span id="topGunluk">0</span></p>

<p>Toplam Hedef: <span id="topHedef">0</span></p>

<p>Tamamlanan Hedef: <span id="tamamlanan">0</span></p>
</div>

</div>

<script>

let sifre = localStorage.getItem("sifre");

if(!sifre){

sifre = prompt("İlk şifreni belirle");

if(sifre){
localStorage.setItem("sifre",sifre);
}

}

function giris(){

let girilen =
document.getElementById("sifre").value;

if(girilen===sifre){

document.getElementById("loginBox").style.display="none";

document.getElementById("app").classList.remove("hidden");

}
else{

document.getElementById("hata").innerText=
"Yanlış şifre";

}

}

let gunlukler =
JSON.parse(localStorage.getItem("gunlukler")||"[]");

function kaydet(){

let tarih =
document.getElementById("tarih").value;

let yazi =
document.getElementById("gunluk").value;

let ruh =
document.getElementById("ruh").value;

if(tarih==="" || yazi.trim()===""){

alert("Tarih ve günlük gir");

return;

}

gunlukler.push({

tarih:tarih,
yazi:yazi,
ruh:ruh

});

localStorage.setItem(
"gunlukler",
JSON.stringify(gunlukler)
);

document.getElementById("gunluk").value="";

istatistik();

alert("Kaydedildi");

}

let hedefler =
JSON.parse(localStorage.getItem("hedefler")||"[]");

function hedefEkle(){

let hedef =
document.getElementById("hedefInput").value;

if(hedef.trim()==="") return;

hedefler.push({

isim:hedef,
tamam:false

});

localStorage.setItem(
"hedefler",
JSON.stringify(hedefler)
);

document.getElementById("hedefInput").value="";

hedefListe();

}

function hedefListe(){

let liste =
document.getElementById("hedefListe");

liste.innerHTML="";

let tamam=0;

hedefler.forEach((h,i)=>{

if(h.tamam) tamam++;

liste.innerHTML +=
`<li>
<input type="checkbox"
${h.tamam?"checked":""}
onchange="degistir(${i})">
${h.isim}
</li>`;

});

document.getElementById("tamamlanan").innerText=
tamam;

document.getElementById("topHedef").innerText=
hedefler.length;

}

function degistir(i){

hedefler[i].tamam =
!hedefler[i].tamam;

localStorage.setItem(
"hedefler",
JSON.stringify(hedefler)
);

hedefListe();

}

function arama(){

let metin =
document.getElementById("aramaInput")
.value.toLowerCase();

let liste =
document.getElementById("aramaListe");

liste.innerHTML="";

gunlukler.forEach(g=>{

if(
g.yazi.toLowerCase().includes(metin)
){

liste.innerHTML +=
`<li>${g.tarih} - ${g.yazi}</li>`;

}

});

}

function istatistik(){

document.getElementById("topGunluk")
.innerText =
gunlukler.length;

}

istatistik();
hedefListe();

</script>

</body>
</html>
